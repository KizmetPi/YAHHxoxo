body{

div.Mtab {

  position: absolute;
  top: 50px;
  left: 50px;
  touch-action: none;
}
 
div.tab {
  flex: 1;
  min-height: 0;
  padding: 15px;
  border-bottom-left-radius: 15px;
  border-bottom-right-radius: 15px;
  background-color: OldLace;
  margin-left: 0px;
  white-space: wrap;
  width: 100%;
  overflow: hidden;
  text-overflow: clip;
  border: 4px Solid Wheat ;
  overflow-y: scroll;
  scrollbar-width: none;
  box-sizing: border-box;
}
div.tab::-webkit-scrollbar {
  display: none;
}
div.Tbar {
  text-align: center;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
  background-color:DodgerBLue;
  display:flex;
  justify-content: space-between;
  align-items: center;
  margin-left: 0px;
  margin-top: 0px;
  white-space: wrap;
  width: 100%;
  height: 25px;
  text-overflow: clip;
  border: 5px solid DodgerBlue;
  box-sizing: border-box;
  flex-shrink: 0;
  cursor: grab;
  user-select: none;
}

/* Mobile Portrait & Landscape Adaptations */

</head>
<body>

<div class="Mtab" id="win1">

    </div>

</div>

<!-- WINDOW 2 -->
<div class="Mtab" id="win2" style="top: 120px; left: 200px; width: 450px; height: 350px;">
    <div class="Tbar">
    <span style="color: white; font-weight: bold;">IDKWTPH</span>
    <span style="font-weight: bold; font-family: lucida console;position: relative; left: -10px;">
        <span style="color: yellow;">[-]</span>
        <span style="color: lightgreen;">[/]</span>
        <span style="color: red;">[X]</span>
    </span>
    </div>
    <div class="tab">
        <h1><u>About Us</u></h1>
        <i>We are very kewl :)</i>
        <hr>
        <u> Try dragging and resizing the tabs</u>
    </div>
</div>


<script>
let highestZ = 1;

document.querySelectorAll(".Mtab").forEach((tab) => {
    const bar = tab.querySelector(".Tbar");
    let dragging = false;
    let startX, startY, initialLeft, initialTop;

    // Bring clicked window to the front
    const bringToFront = () => {
        highestZ++;
        tab.style.zIndex = highestZ;
    };

    tab.addEventListener("mousedown", bringToFront);
    tab.addEventListener("touchstart", bringToFront, { passive: true });

    const startDrag = (e) => {
        dragging = true;
        const point = e.touches ? e.touches[0] : e;
        startX = point.clientX;
        startY = point.clientY;
        initialLeft = tab.offsetLeft;
        initialTop = tab.offsetTop;
        bar.style.cursor = "grabbing";
        tab.style.setProperty('left', initialLeft + 'px', 'important');
        tab.style.setProperty('top', initialTop + 'px', 'important');
    };

    const onDrag = (e) => {
        if (!dragging) return;
        const point = e.touches ? e.touches[0] : e;
        const dx = point.clientX - startX;
        const dy = point.clientY - startY;
        tab.style.setProperty('left', (initialLeft + dx) + 'px', 'important');
        tab.style.setProperty('top', (initialTop + dy) + 'px', 'important');
    };

    const stopDrag = () => {
        dragging = false;
        bar.style.cursor = "grab";
    };

    bar.addEventListener("mousedown", startDrag);
    bar.addEventListener("touchstart", startDrag, { passive: true });

    document.addEventListener("mousemove", onDrag);
    document.addEventListener("touchmove", onDrag, { passive: true });

    document.addEventListener("mouseup", stopDrag);
    document.addEventListener("touchend", stopDrag);
});
</script>
</body>
