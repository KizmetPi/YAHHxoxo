<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YAHHxoxo App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            /* Local background image setup */
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #111;
            color: #fff;
            overflow: hidden;
        }
        /* Draggable Window / Tab Style */
        .window {
            position: absolute;
            width: 320px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            user-select: none;
        }
        .window-header {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            cursor: grab;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            touch-action: none;
        }
        .window-header:active {
            cursor: grabbing;
        }
        .window-body {
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        .window-body img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        /* Responsive layout for Portrait & Landscape on phones */
        @media (orientation: portrait) {
            #appWindow {
                width: 90vw;
                top: 60px !important;
                left: 5vw !important;
            }
        }
        @media (orientation: landscape) {
            #appWindow {
                width: 60vw;
                top: 40px !important;
                left: 20vw !important;
            }
        }
    </style>
</head>
<body>

    <!-- Sample Draggable Window with Inserted Image -->
    <div class="window" id="appWindow">
        <div class="window-header" id="windowHeader">
            <span>YAHHxoxo Tab</span>
            <span>⋮⋮</span>
        </div>
        <div class="window-body">
            <p>Welcome to my app! Everything is loading correctly now.</p>
            <!-- Inserted local image -->
            <img src="image1.png" alt="App Image">
        </div>
    </div>

    <script>
        // Smooth Dragging Logic for Mobile and Desktop
        const win = document.getElementById('appWindow');
        const header = document.getElementById('windowHeader');

        let isDragging = false;
        let startX, startY, initialX, initialY;

        header.addEventListener('mousedown', dragStart);
        header.addEventListener('touchstart', dragStart, {passive: true});

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: true});

        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            const point = e.type === 'touchstart' ? e.touches[0] : e;
            startX = point.clientX;
            startY = point.clientY;
            initialX = win.offsetLeft;
            initialY = win.offsetTop;
            win.style.setProperty('left', initialX + 'px', 'important');
            win.style.setProperty('top', initialY + 'px', 'important');
        }

        function drag(e) {
            if (!isDragging) return;
            const point = e.type === 'touchmove' ? e.touches[0] : e;
            const currentX = point.clientX;
            const currentY = point.clientY;
            
            const dx = currentX - startX;
            const dy = currentY - startY;

            win.style.setProperty('left', `${initialX + dx}px`, 'important');
            win.style.setProperty('top', `${initialY + dy}px`, 'important');
        }

        function dragEnd() {
            isDragging = false;
        }
    </script>
</body>
</html>
